<!DOCTYPE html>
<html>
<head>
    <title>DMS Redirect</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #667eea; color: white; }
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>🚀 DMS - Reindirizzamento</h2>
    <div class="spinner"></div>
    <p id="status">Caricamento...</p>
    <script>
        const shortId = window.location.pathname.split('/').pop();
        const linkData = localStorage.getItem(`dms_short_${shortId}`);
        if (linkData) {
            const data = JSON.parse(linkData);
            document.getElementById('status').textContent = `Reindirizzamento per ${data.userEmail}...`;
            setTimeout(() => window.location.href = data.longUrl, 1500);
        } else {
            document.getElementById('status').textContent = 'Link non trovato';
            setTimeout(() => window.location.href = '/dms-gemello-news/landing/home.html', 3000);
        }
    </script>
</body>
</html>
