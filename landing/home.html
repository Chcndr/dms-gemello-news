<!DOCTYPE html>
<html lang="it">
<head>
<script>
(function(){
  function show(msg){
    var el=document.createElement('pre');
    el.style.cssText='position:fixed;inset:0;z-index:99999;background:#0b0f14;color:#fff;padding:16px;overflow:auto;font:14px system-ui;white-space:pre-wrap';
    el.textContent='BOOT ERROR\n\n'+msg;
    document.documentElement.appendChild(el);
  }
  window.onerror=(m,src,ln,cn,err)=>show((err&&err.stack)||(`${m}\n@ ${src}:${ln}:${cn}`));
  window.onunhandledrejection=(e)=>show('Promise rejection:\n'+(e.reason&&e.reason.stack||e.reason));
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
