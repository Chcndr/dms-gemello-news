<!DOCTYPE html>

<head>
<script>
(function(){
  function show(msg){
    var el=document.createElement('pre');
    el.style.cssText='position:fixed;inset:0;z-index:99999;background:#0b0f14;color:#fff;padding:16px;overflow:auto;font:14px/1.4 system-ui;white-space:pre-wrap';
    el.textContent='BOOT ERROR\n\n'+msg;
    document.documentElement.appendChild(el);
  }
  window.onerror=function(m,src,ln,cn,err){show((err&&err.stack)||(`${m}\n@ ${src}:${ln}:${cn}`));};
  window.onunhandledrejection=function(ev){show('Promise rejection:\n'+(ev.reason&&ev.reason.stack||ev.reason));};
})();
</script>

<script>

}
</script>
