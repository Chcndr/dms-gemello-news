<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Politica 0 • Visione DMS</title>
  <style>
    :root{
      --bg:#0b3b3e; --fg:#f3e8c9; --muted:#a7cfc4; --accent:#34d1b6;
      --thumb:#0f4a4e; --shadow:0 10px 30px rgba(0,0,0,.25)
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif}
    header{position:sticky;top:0;background:linear-gradient(180deg,rgba(11,59,62,.95),rgba(11,59,62,.6) 80%,transparent);backdrop-filter:saturate(140%) blur(6px);padding:14px 20px;z-index:5;border-bottom:1px solid rgba(255,255,255,.06)}
    h1{margin:0;font-size: clamp(20px,2.8vw,28px);letter-spacing:.4px}
    .sub{opacity:.8;font-size:clamp(12px,2vw,14px)}
    .wrap{max-width:1400px;margin:24px auto;padding:0 16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
    .card{background:var(--thumb);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:zoom-in;border:1px solid rgba(255,255,255,.06)}
    .card img{width:100%;height:220px;object-fit:cover;display:block;transition:transform .35s ease}
    .card:hover img{transform:scale(1.03)}
    .caption{padding:10px 12px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
    /* Lightbox */
    .lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:50}
    .lightbox.on{display:flex}
    .frame{max-width:min(96vw,1600px);max-height:86vh;position:relative}
    .frame img{max-width:100%;max-height:86vh;border-radius:14px;box-shadow:var(--shadow);transform-origin:center center;transition:transform .2s ease}
    .ui{position:absolute;inset:auto 0 -56px 0;display:flex;gap:8px;justify-content:center}
    .btn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);padding:8px 12px;border-radius:10px;cursor:pointer}
    .x{position:absolute;top:-44px;right:0}
    .navL,.navR{position:absolute;top:50%;transform:translateY(-50%);font-size:22px}
    .navL{left:-42px}.navR{right:-42px}
    .hint{position:fixed;left:12px;bottom:10px;color:var(--muted);font-size:12px;opacity:.85}
    a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Politica 0 — Visione DMS</h1>
      <div class="sub">Pagina indipendente con le infografiche: passa il mouse e apri a tutto schermo. (Non tocca l'orologio né le schede.)</div>
    </div>
  </header>

  <main class="wrap">
    <section class="grid" id="grid"></section>
  </main>

  <div class="lightbox" id="lb" aria-hidden="true">
    <div class="frame">
      <button class="btn x" id="close">Chiudi ✕</button>
      <button class="btn navL" id="prev">‹</button>
      <img id="full" alt="" />
      <button class="btn navR" id="next">›</button>
      <div class="ui">
        <button class="btn" id="zIn">Zoom +</button>
        <button class="btn" id="zOut">Zoom −</button>
        <button class="btn" id="zReset">Adatta</button>
      </div>
    </div>
  </div>

  <div class="hint">Suggerimento: clic per aprire, frecce ◀ ▶ per cambiare, doppio clic per zoom.</div>

  <script>
    // Percorso RELATIVO (la pagina è in /landing/pol0/, le immagini in /assets/pol0/)
    const base = '../../assets/pol0/';

    // Elenco slide (si possono aggiungere tante altre voci)
    const slides = [
      {file:'slide-01-dms-gemello-digitale.png',  title:'DMS — Gemello Digitale del Commercio'},
      {file:'slide-02-governance-bandi-bolkestein.png', title:'Governance • Bandi • Criteri Bolkestein'},
      {file:'slide-03-carbon-credit-doganale.png', title:'Crediti di Carbonio — univoco doganale'},
      {file:'slide-04-indicatori-economici.png', title:'Indicatori economici: Stato • Imprese • Cittadini'},
      {file:'slide-05-dms-al-centro.png', title:'DMS al centro di tutto — interoperabilità'},
      {file:'slide-06-gis-del-commercio.png', title:'GIS del Commercio — digitalizza → connette → abilita'}
    ];

    // Popola griglia
    const grid = document.getElementById('grid');
    slides.forEach((s,i)=>{
      const card = document.createElement('article');
      card.className='card';
      card.innerHTML = `
        <img loading="lazy" src="${base + s.file}" alt="${s.title}">
        <div class="caption"><span class="dot"></span>${s.title}</div>`;
      card.onclick = ()=> openLb(i);
      grid.appendChild(card);
    });

    // Lightbox
    const lb = document.getElementById('lb');
    const full = document.getElementById('full');
    let idx=0, scale=1;

    function openLb(i){ idx=i; scale=1; full.style.transform='scale(1)'; full.src = base + slides[idx].file; lb.classList.add('on'); lb.setAttribute('aria-hidden','false'); }
    function closeLb(){ lb.classList.remove('on'); lb.setAttribute('aria-hidden','true'); }
    function nav(d){ idx = (idx + d + slides.length) % slides.length; scale=1; full.style.transform='scale(1)'; full.src = base + slides[idx].file; }

    document.getElementById('close').onclick=closeLb;
    document.getElementById('prev').onclick = ()=>nav(-1);
    document.getElementById('next').onclick = ()=>nav(+1);

    document.getElementById('zIn').onclick = ()=>{ scale=Math.min(3, scale+0.2); full.style.transform=`scale(${scale})`; };
    document.getElementById('zOut').onclick= ()=>{ scale=Math.max(1, scale-0.2); full.style.transform=`scale(${scale})`; };
    document.getElementById('zReset').onclick= ()=>{ scale=1; full.style.transform='scale(1)'; };

    full.ondblclick = ()=>{ scale = (scale===1? 1.8:1); full.style.transform=`scale(${scale})`; };

    // Esc + frecce
    window.addEventListener('keydown',e=>{
      if(!lb.classList.contains('on')) return;
      if(e.key==='Escape') closeLb();
      if(e.key==='ArrowRight') nav(+1);
      if(e.key==='ArrowLeft')  nav(-1);
      if(e.key==='+' || e.key==='=') document.getElementById('zIn').click();
      if(e.key==='-' ) document.getElementById('zOut').click();
    });

    // Chiudi cliccando fuori
    lb.addEventListener('click', e=>{ if(e.target===lb) closeLb(); });
  </script>
</body>
</html>
