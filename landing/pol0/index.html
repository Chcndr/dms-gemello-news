<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Politica 0 • Visione DMS</title>
  <style>
    :root{
      --bg:#0b3b3e; --fg:#f3e8c9; --muted:#a7cfc4; --accent:#34d1b6;
      --thumb:#0f4a4e; --shadow:0 10px 30px rgba(0,0,0,.25)
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif}

    /* Header */
    header{position:sticky;top:0;background:linear-gradient(180deg,rgba(11,59,62,.95),rgba(11,59,62,.6) 80%,transparent);
      backdrop-filter:saturate(140%) blur(6px);padding:12px 16px;z-index:5;border-bottom:1px solid rgba(255,255,255,.06)}
    h1{margin:0;font-size:clamp(18px,2.6vw,26px);letter-spacing:.3px}
    .sub{opacity:.8;font-size:clamp(12px,1.9vw,14px)}
    .wrap{max-width:1400px;margin:18px auto;padding:0 16px}

    /* Grid */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
    .card{background:var(--thumb);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:zoom-in;border:1px solid rgba(255,255,255,.06)}
    .card img{width:100%;height:220px;object-fit:cover;display:block;transition:transform .35s ease}
    .card:hover img{transform:scale(1.03)}
    .caption{padding:10px 12px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

    /* Lightbox full-screen */
    .lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
      background:rgba(11,59,62,.96);
      z-index:50;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .lightbox.on{display:flex}
    .frame{max-width:min(96vw,1600px);max-height:86vh;position:relative}
    .frame img{max-width:100%;max-height:86vh;border-radius:14px;box-shadow:var(--shadow);transform-origin:center center;transition:transform .2s ease}
    .ui{position:absolute;left:0;right:0;bottom:-56px;display:flex;gap:8px;justify-content:center}
    .btn{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.28);padding:9px 14px;border-radius:12px;cursor:pointer}
    .x{position:absolute;top:-44px;right:0}
    .navL,.navR{position:absolute;top:50%;transform:translateY(-50%);font-size:22px}
    .navL{left:-42px}.navR{right:-42px}
    .hint{position:fixed;left:12px;bottom:10px;color:var(--muted);font-size:12px;opacity:.85}
    .tools{display:flex;gap:10px;align-items:center;margin-top:10px}
    .tools .btn{padding:8px 12px}

    /* Mobile / iPad: pulsanti più grandi + più spazio per l'immagine */
    @media (max-width: 900px){
      .frame{max-width:98vw;max-height:78vh}
      .frame img{max-height:78vh}
      .navL{left:-30px}.navR{right:-30px}
      .btn{padding:11px 16px;font-size:16px;border-radius:14px}
      .x{top:-50px}
      .hint{font-size:11px}
    }
    
    body.lb-open main{filter:blur(2px) brightness(.5); pointer-events:none;}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Politica 0 — Visione DMS</h1>
      <div class="sub">Si apre direttamente la slide principale. "Mostra griglia" per vedere tutte le infografiche.</div>
      <div class="tools">
        <button class="btn" id="showGrid">Mostra griglia</button>
        <a class="btn" href="?open=1">Riapri slide 1</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="grid" id="grid"></section>
  </main>

  <div class="lightbox" id="lb" aria-hidden="true">
    <div class="frame" id="frame">
      <button class="btn x" id="close">Chiudi ✕</button>
      <button class="btn navL" id="prev">‹</button>
      <img id="full" alt="" />
      <button class="btn navR" id="next">›</button>
      <div class="ui">
        <button class="btn" id="zIn">Zoom +</button>
        <button class="btn" id="zOut">Zoom −</button>
        <button class="btn" id="zReset">Adatta</button>
      </div>
    </div>
  </div>

  <div class="hint">Gesti: swipe ◀ ▶ per cambiare, doppio tap per zoom. Esc per chiudere.</div>

  <script>
    /* Config immagini */
    const slides = [
      {file:'slide-01-dms-gemello-digitale.png',  title:'DMS — Gemello Digitale del Commercio'},
      {file:'slide-02-governance-bandi-bolkestein.png', title:'Governance • Bandi • Criteri Bolkestein'},
      {file:'slide-03-carbon-credit-doganale.png', title:'Crediti di Carbonio — univoco doganale'},
      {file:'slide-04-indicatori-economici.png', title:'Indicatori economici: Stato • Imprese • Cittadini'},
      {file:'slide-05-dms-al-centro.png', title:'DMS al centro di tutto — interoperabilità'},
      {file:'slide-06-gis-del-commercio.png', title:'GIS del Commercio — digitalizza → connette → abilita'}
    ];
    // index.html sta in /landing/pol0 → risalgo di 2 cartelle
    const base = '../../assets/pol0/';
    const grid = document.getElementById('grid');

    /* Popola griglia */
    slides.forEach((s,i)=>{
      const el = document.createElement('article');
      el.className='card';
      el.innerHTML = `<img loading="lazy" src="${base+s.file}" alt="${s.title}">
                      <div class="caption"><span class="dot"></span>${s.title}</div>`;
      el.onclick = ()=> openLb(i);
      grid.appendChild(el);
    });

    /* Lightbox */
    const lb = document.getElementById('lb');
    const full = document.getElementById('full');
    const frame = document.getElementById('frame');
    let idx=0, scale=1;

    function openLb(i){
      idx=i; scale=1;
      full.style.transform='scale(1)';
      full.src = base + slides[idx].file;
      lb.classList.add('on'); lb.setAttribute('aria-hidden','false');
      document.body.classList.add('lb-open');
    }
    function closeLb(){
      lb.classList.remove('on'); lb.setAttribute('aria-hidden','true');
      document.body.classList.remove('lb-open');
    }
    function nav(d){ idx = (idx + d + slides.length) % slides.length; scale=1; full.style.transform='scale(1)'; full.src = base + slides[idx].file; }

    document.getElementById('close').onclick=closeLb;
    document.getElementById('prev').onclick = ()=>nav(-1);
    document.getElementById('next').onclick = ()=>nav(+1);
    document.getElementById('zIn').onclick = ()=>{ scale=Math.min(3, scale+0.2); full.style.transform=`scale(${scale})`; };
    document.getElementById('zOut').onclick= ()=>{ scale=Math.max(1, scale-0.2); full.style.transform=`scale(${scale})`; };
    document.getElementById('zReset').onclick= ()=>{ scale=1; full.style.transform='scale(1)'; };

    full.ondblclick = ()=>{ scale = (scale===1? 1.8:1); full.style.transform=`scale(${scale})`; };

    // Swipe per mobile
    let tX=0,tY=0;
    frame.addEventListener('touchstart',e=>{ const t=e.touches[0]; tX=t.clientX; tY=t.clientY; },{passive:true});
    frame.addEventListener('touchend',e=>{
      const t = e.changedTouches[0]; const dx=t.clientX-tX, dy=Math.abs(t.clientY-tY);
      if(Math.abs(dx)>40 && dy<60) nav(dx<0?+1:-1);
    },{passive:true});

    // Esc + frecce + +/- 
    window.addEventListener('keydown',e=>{
      if(!lb.classList.contains('on')) return;
      if(e.key==='Escape') closeLb();
      if(e.key==='ArrowRight') nav(+1);
      if(e.key==='ArrowLeft')  nav(-1);
      if(e.key==='+' || e.key==='=') document.getElementById('zIn').click();
      if(e.key==='-') document.getElementById('zOut').click();
    });
    lb.addEventListener('click', e=>{ if(e.target===lb) closeLb(); });

    // ▶︎ Auto-open all'avvio
    const qp = new URLSearchParams(location.search);
    const startGrid = qp.has('grid'); // se presente: non auto-open
    // open può essere numero 1..N oppure filename
    const openParam = qp.get('open');
    let startIndex = 0; // slide 1 = indice 0
    if(openParam){
      const n = parseInt(openParam,10);
      if(!Number.isNaN(n) && n>=1 && n<=slides.length) startIndex = n-1;
      else{
        const fi = slides.findIndex(s => s.file===openParam);
        if(fi>=0) startIndex = fi;
      }
    }
    if(!startGrid){ 
      // aspetta un tick e apri direttamente la slide
      setTimeout(()=>openLb(startIndex), 0);
    }

    // Pulsante "Mostra griglia"
    document.getElementById('showGrid').onclick = ()=>{ closeLb(); scrollTo({top:0,behavior:'smooth'}); };
  </script>
</body>
</html>
