<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Politica 0 • Visione DMS</title>
  <style>
    :root{
      --bg:#0b3b3e; --fg:#f3e8c9; --muted:#a7cfc4; --accent:#34d1b6;
      --thumb:#0f4a4e; --shadow:0 10px 30px rgba(0,0,0,.25)
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif}
    header{position:sticky;top:0;background:linear-gradient(180deg,rgba(11,59,62,.95),rgba(11,59,62,.6) 80%,transparent);
      -webkit-backdrop-filter:saturate(140%) blur(6px);backdrop-filter:saturate(140%) blur(6px);
      padding:14px 20px;z-index:5;border-bottom:1px solid rgba(255,255,255,.06)}
    h1{margin:0;font-size:clamp(20px,2.8vw,28px);letter-spacing:.4px}
    .sub{opacity:.8;font-size:clamp(12px,2vw,14px)}
    .wrap{max-width:1400px;margin:24px auto;padding:0 16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
    .card{background:var(--thumb);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:zoom-in;border:1px solid rgba(255,255,255,.06)}
    .card img{width:100%;height:220px;object-fit:cover;display:block;transition:transform .35s ease}
    .card:hover img{transform:scale(1.03)}
    .caption{padding:10px 12px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
    /* Lightbox */
    .lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
      background:rgba(11,59,62,.96);z-index:50;padding:env(safe-area-inset-top) env(safe-area-inset-right)
      calc(env(safe-area-inset-bottom) + 8px) env(safe-area-inset-left)}
    .lightbox.on{display:flex}
    .frame{max-width:min(96vw,1600px);max-height:calc(100dvh - 100px);position:relative;display:flex;align-items:center;justify-content:center}
    .frame img{max-width:100%;max-height:calc(100vh - 2rem);height:auto;width:auto;object-fit:contain;border-radius:14px;box-shadow:var(--shadow);
      transform-origin:center center;transition:transform .2s ease}
    .ui{position:absolute;left:0;right:0;bottom:-48px;display:flex;gap:8px;justify-content:center}
    .btn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);
      padding:8px 12px;border-radius:10px;cursor:pointer}
    .x{position:absolute;top:-44px;right:0}
    .navL,.navR{position:absolute;top:50%;transform:translateY(-50%);font-size:22px}
    .navL{left:-42px}.navR{right:-42px}
    .hint{position:fixed;left:12px;bottom:10px;color:var(--muted);font-size:12px;opacity:.85}
    a{color:var(--accent);text-decoration:none}
    /* niente flash della griglia durante il boot */
    body.boot main{visibility:hidden}
    /* attenua e blocca la griglia quando la lightbox è aperta */
    body.lb-open main{filter:blur(2px) brightness(.5); pointer-events:none;}
    
    @media (max-width: 900px){
      .frame{max-width:98vw;max-height:calc(100vh - 120px)}
      .frame img{max-height:calc(100vh - 160px)}
      .ui{bottom:-40px}
      .navL{left:-35px}.navR{right:-35px}
    }
  </style>
</head>
<body class="boot">
  <header>
    <div class="wrap">
      <h1>Politica 0 — Visione DMS</h1>
      <div class="sub">Si apre direttamente la slide principale. "Mostra griglia" per vedere tutte le infografiche.</div>
    </div>
  </header>

  <main class="wrap">
    <section class="grid" id="grid"></section>
  </main>

  <div class="lightbox" id="lb" aria-hidden="true">
    <div class="frame">
      <button class="btn x" id="close">Chiudi ✕</button>
      <button class="btn navL" id="prev">‹</button>
      <img id="full" alt="" />
      <button class="btn navR" id="next">›</button>
      <div class="ui">
        <button class="btn" id="zIn">Zoom +</button>
        <button class="btn" id="zOut">Zoom −</button>
        <button class="btn" id="backHome">← Torna all'orologio</button>
      </div>
    </div>
  </div>
  <div class="hint">Gesti: swipe ◀ ▶ per cambiare, doppio tap per zoom. Esc per chiudere.</div>

  <script>
    // Elenco slide
    const slides = [
      {file:'slide-02-dms-gemello-digitale.jpg',  title:'DMS — Gemello Digitale del Commercio'},
      {file:'slide-03-governance-bandi-bolkestein.jpg', title:'Governance • Bandi • Criteri Bolkestein'},
      {file:'slide-04-carbon-credit-doganale.jpg', title:'Crediti di Carbonio — univoco doganale'},
      {file:'slide-05-indicatori-economici.jpg', title:'Indicatori economici: Stato • Imprese • Cittadini'},
      {file:'slide-06-dms-al-centro.jpg', title:'DMS al centro di tutto — interoperabilità'},
      {file:'slide-07-gis-del-commercio.jpg', title:'GIS del Commercio — digitalizza → connette → abilita'}
    ];
    // index.html sta in /landing/pol0 → risalgo di 2 cartelle
    const base = '../../assets/pol0/';

    const params = new URLSearchParams(location.search);
    const openAuto = params.get('open') !== '0';            // default: apri subito
    const hoverMode = params.get('mode') === 'hover';       // opzionale: apri su hover (desktop)

    // URL della pagina orologio
    const BACK_URL = 'https://chcndr.github.io/dms-gemello-news/landing/home.html';

    const grid = document.getElementById('grid');
    const lb   = document.getElementById('lb');
    const full = document.getElementById('full');
    let idx=0, scale=1;

    // Build griglia
    function buildGrid(){
      slides.forEach((s,i)=>{
        const card = document.createElement('article');
        card.className='card';
        card.innerHTML = `<img loading="lazy" src="${base + s.file}" alt="${s.title}">
                          <div class="caption"><span class="dot"></span>${s.title}</div>`;
        card.onclick = ()=> openLb(i);
        if (hoverMode && matchMedia('(pointer:fine)').matches){
          card.onmouseenter = ()=> openLb(i);
        }
        grid.appendChild(card);
      });
    }

    // Preload immagini
    const preload = src => new Promise(res=>{
      const link = document.createElement('link');
      link.rel='preload'; link.as='image'; link.href=src;
      document.head.appendChild(link);
      const img = new Image();
      img.onload=()=>res(); img.onerror=()=>res(); img.src=src;
    });

    // Lightbox
    function openLb(i){
      idx=i; scale=1;
      full.style.transform='scale(1)';
      full.src = base + slides[idx].file;
      lb.classList.add('on'); lb.setAttribute('aria-hidden','false');
      document.body.classList.add('lb-open');
      // Forza il ricalcolo delle dimensioni dopo l'apertura
      setTimeout(adjustImageSize, 50);
    }
    function closeLb(){
      lb.classList.remove('on'); lb.setAttribute('aria-hidden','true');
      document.body.classList.remove('lb-open');
    }
    function nav(d){ 
      idx=(idx+d+slides.length)%slides.length; 
      scale=1; 
      full.style.transform='scale(1)'; 
      full.src=base+slides[idx].file;
      // Ricalcola le dimensioni per la nuova immagine
      setTimeout(adjustImageSize, 50);
    }

    // Funzione per regolare dinamicamente le dimensioni dell'immagine
    function adjustImageSize() {
      if (!lb.classList.contains('on')) return;
      
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const isMobile = viewportWidth <= 900;
      
      // Calcola l'altezza massima disponibile
      const maxHeight = isMobile ? viewportHeight - 160 : viewportHeight - 32;
      const maxWidth = isMobile ? viewportWidth * 0.98 : Math.min(viewportWidth * 0.96, 1600);
      
      full.style.maxHeight = maxHeight + 'px';
      full.style.maxWidth = maxWidth + 'px';
    }

    document.getElementById('close').onclick=closeLb;
    document.getElementById('prev').onclick = ()=>nav(-1);
    document.getElementById('next').onclick = ()=>nav(+1);
    document.getElementById('zIn').onclick = ()=>{ scale=Math.min(3, scale+0.2); full.style.transform=`scale(${scale})`; };
    document.getElementById('zOut').onclick= ()=>{ scale=Math.max(1, scale-0.2); full.style.transform=`scale(${scale})`; };
    document.getElementById('backHome').onclick = () => {
      window.location.href = BACK_URL;
    };
    full.ondblclick = ()=>{ scale = (scale===1? 1.8:1); full.style.transform=`scale(${scale})`; };

    // Tasti & swipe
    window.addEventListener('keydown',e=>{
      if(!lb.classList.contains('on')) return;
      if(e.key==='Escape') closeLb();
      if(e.key==='ArrowRight') nav(+1);
      if(e.key==='ArrowLeft')  nav(-1);
      if(e.key==='+' || e.key==='=') document.getElementById('zIn').click();
      if(e.key==='-') document.getElementById('zOut').click();
    });
    let touchX=null;
    lb.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
    lb.addEventListener('touchend',e=>{
      if(touchX===null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if(Math.abs(dx)>40) nav(dx<0?+1:-1);
      touchX=null;
    });

    // Boot: preload 1ª slide → apri subito → poi costruisci griglia e pre-carica le altre
    (async function boot(){
      await preload(base + slides[0].file);
      if (openAuto) openLb(0);
      buildGrid();
      // Preload silenzioso delle altre per cambio istantaneo
      slides.slice(1).forEach(s=>preload(base + s.file));
      document.body.classList.remove('boot');
    })();

    // Gestione ridimensionamento finestra e rotazione iPad
    window.addEventListener('resize', () => {
      adjustImageSize();
    });
    
    // Gestione orientamento per dispositivi mobili
    window.addEventListener('orientationchange', () => {
      setTimeout(adjustImageSize, 100);
    });

    // Preload + apertura rapida della prima slide per evitare secondo "vuoto" iniziale
    window.addEventListener('load', () => {
      const img0 = new Image();
      img0.src = base + slides[0].file;
      img0.onload = () => { if (openAuto && !lb.classList.contains('on')) openLb(0); };
      // Fallback se la CDN è lenta
      setTimeout(() => { if (openAuto && !lb.classList.contains('on')) openLb(0); }, 2000);
    });
  </script>
</body>
</html>
