<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Politica 0 — Visione DMS</title>
  <link rel="preload" as="image" href="slides/01.jpg?v=pol0-lock2">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a2e2e 0%, #1a4a4a 100%);
      color: #fff;
      min-height: 100vh;
    }
    
    .header {
      text-align: center;
      padding: 2rem 1rem;
      background: rgba(0,0,0,0.3);
    }
    
    .header h1 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      margin-bottom: 0.5rem;
      color: #f0f8f8;
    }
    
    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    
    .card figcaption {
      padding: 1rem;
      font-size: 0.9rem;
      text-align: center;
      background: rgba(0,0,0,0.2);
    }
    
    /* Lightbox CSS (no ratio fisso) */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(8,28,28,.86);
      padding: clamp(8px,2vh,24px);
    }
    
    .lightbox.open {
      display: flex;
    }
    
    .lightbox__img {
      max-width: min(96vw, 1600px);
      max-height: calc(100dvh - 2*clamp(8px,2vh,24px));
      width: auto;
      height: auto;
      object-fit: contain;
      background: transparent;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    
    .lb-close, .lb-prev, .lb-next {
      position: absolute;
      background: rgba(0,0,0,.45);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: .6rem .8rem;
      font-size: 16px;
      backdrop-filter: saturate(1.4) blur(6px);
      cursor: pointer;
      transition: background 0.2s ease;
    }
    
    .lb-close:hover, .lb-prev:hover, .lb-next:hover {
      background: rgba(0,0,0,.65);
    }
    
    .lb-close {
      top: 10px;
      right: 10px;
    }
    
    .lb-prev {
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
    
    .lb-next {
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
    
    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
      transition: background 0.2s ease;
    }
    
    .back-link:hover {
      background: rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
     <a href="../home.html" class="back-link">← Torna all'orologio</a>
  
  <div class="header">
    <h1>Politica 0 — Visione DMS</h1>
    <p>Esplora le slide della strategia DMS per il rilancio del commercio italiano</p>
  </div>
  
  <section id="gallery" class="grid"></section>
  
  <!-- Lightbox -->
  <div class="lightbox" id="lb" aria-hidden="true">
    <button class="lb-close" aria-label="Chiudi" onclick="LB.close()">Chiudi ×</button>
    <img class="lightbox__img" id="lb-img" alt="">
    <button class="lb-prev" aria-label="Precedente" onclick="LB.prev()">‹</button>
    <button class="lb-next" aria-label="Successiva" onclick="LB.next()">›</button>
  </div>

  <script>
    // Lightbox minimale
    const LB = (() => {
      let i = 0, slides = [];
      const lb = document.getElementById('lb');
      const img = document.getElementById('lb-img');

      function open(idx) {
        i = idx;
        const s = slides[i];
        img.src = s.src;
        img.alt = s.alt || '';
        lb.classList.add('open');
        lb.setAttribute('aria-hidden', 'false');
      }
      
      function close() {
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        img.removeAttribute('src');
      }
      
      function next() {
        i = (i + 1) % slides.length;
        open(i);
      }
      
      function prev() {
        i = (i - 1 + slides.length) % slides.length;
        open(i);
      }

      function mount() {
        slides = [...document.querySelectorAll('[data-slide]')].map((el, idx) => {
          el.addEventListener('click', () => open(idx));
          return { src: el.dataset.src, alt: el.dataset.alt || ('Slide ' + (idx + 1)) };
        });
        
        lb.addEventListener('click', e => {
          if (e.target === lb) close();
        });
        
        document.addEventListener('keydown', e => {
          if (!lb.classList.contains('open')) return;
          if (e.key === 'Escape') close();
          if (e.key === 'ArrowRight') next();
          if (e.key === 'ArrowLeft') prev();
        });
      }
      
      return { mount, open, close, next, prev };
    })();

    // Griglia autogenerata (47 slide)
    const NUM = 47;
    const grid = document.getElementById('gallery');
    
    const slideNames = [
      'ITALIA — Emergenza Commercio',
      'DMS — Gemello Digitale del Commercio', 
      'Governance • Bandi • Criteri Bolkestein',
      'Crediti di Carbonio — Univoco Doganale',
      'Indicatori Economici',
      'DMS al Centro di Tutto',
      'GIS del Commercio — DMS',
      'Gettito Progressivo — Strategia Carbon Credit',
      'Redistribuzione Benefici — Famiglia Italiana',
      'Impatti Economici — PMI e Posti Lavoro',
      'Timeline Implementazione — DMS + UE',
      'Confronto Scenari — Attuale vs DMS 2030'
    ];
    
    grid.innerHTML = Array.from({length: NUM}, (_, i) => {
      const n = String(i + 1).padStart(2, '0');
      const src = `slides/${n}.jpg`;
      const title = slideNames[i] || `Slide ${n}`;
      return `
        <figure class="card">
          <img src="${src}" alt="${title}" data-slide data-src="${src}" data-alt="${title}" loading="lazy">
          <figcaption>${title}</figcaption>
        </figure>`;
    }).join('');
    
    // Monta il lightbox dopo aver creato la griglia
    window.addEventListener('DOMContentLoaded', () => LB.mount());
    
    // Apertura immediata slide 1
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { openLightbox(0); }, 100);
    });
  </script>
</body>
</html>
