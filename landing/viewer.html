<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMS Viewer</title>
  
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000 !important;
      color: #fff;
      overflow: hidden;
    }
    
    #pdf {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #000 !important;
    }
    
    /* Forza sfondo nero anche sull'iframe */
    iframe {
      background: #000 !important;
    }
    
    /* Anti-stampa */
    @media print { 
      * { display: none !important; } 
    }
  </style>
</head>
<body>
  <iframe id="pdf" allowfullscreen></iframe>

  <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const src = params.get('src');
      if (src) {
        document.getElementById('pdf').src = src;
      }
      
      // Anti-stampa
      document.addEventListener('keydown', function(e){
        const k = (e.key||'').toLowerCase();
        if ((e.ctrlKey || e.metaKey) && (k === 'p' || e.keyCode === 80)) {
          e.preventDefault(); 
          e.stopPropagation();
          alert('Stampa disabilitata.');
        }
        // Anti-download
        if ((e.ctrlKey || e.metaKey) && (k === 's' || e.keyCode === 83)) {
          e.preventDefault(); 
          e.stopPropagation();
          alert('Download disabilitato.');
        }
      });
      
      document.addEventListener('contextmenu', e => e.preventDefault());
      window.onbeforeprint = () => {
        document.body.innerHTML = '';
        setTimeout(() => location.replace('about:blank'), 0);
      };
    })();
  </script>
</body>
</html>
