<!DOCTYPE html>
<html lang="it" style="background: #000 !important;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMS Viewer</title>
  
  <style>
    * {
      margin: 0 !important;
      padding: 0 !important;
      background: #000 !important;
      color: #fff !important;
    }
    
    html, body {
      height: 100% !important;
      width: 100% !important;
      background: #000 !important;
      overflow: hidden !important;
    }
    
    #pdf {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      border: 0 !important;
      background: #000 !important;
      z-index: 1 !important;
    }
    
    /* Anti-stampa totale */
    @media print { 
      html, body, * { 
        display: none !important; 
        visibility: hidden !important;
        background: #000 !important;
      } 
    }
    
    /* Nascondi tutto durante stampa */
    @page { 
      margin: 0 !important; 
      background: #000 !important; 
    }
  </style>
  
  <!-- Anti-stampa JavaScript -->
  <script>
    // Blocco immediato
    (function(){
      // Disabilita stampa
      window.print = function() { 
        alert('Stampa disabilitata.'); 
        return false; 
      };
      
      // Blocca scorciatoie
      document.addEventListener('keydown', function(e){
        const k = (e.key||'').toLowerCase();
        // Blocca Ctrl+P, Ctrl+S, F12, Ctrl+Shift+I
        if ((e.ctrlKey || e.metaKey) && (k === 'p' || k === 's' || e.keyCode === 80 || e.keyCode === 83)) {
          e.preventDefault(); 
          e.stopPropagation();
          e.stopImmediatePropagation();
          alert('Funzione disabilitata.');
          return false;
        }
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && e.keyCode === 73)) {
          e.preventDefault();
          return false;
        }
      }, true);
      
      // Blocca menu contestuale
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, true);
      
      // Hook stampa
      window.onbeforeprint = function() {
        document.body.innerHTML = '<div style="background:#000;color:#000;height:100vh;">.</div>';
        return false;
      };
      
      // Blocca selezione
      document.addEventListener('selectstart', e => e.preventDefault());
      document.addEventListener('dragstart', e => e.preventDefault());
      
    })();
  </script>
</head>
<body style="background: #000 !important;">
  <iframe id="pdf" allowfullscreen style="background: #000 !important;"></iframe>

  <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const src = params.get('src');
      if (src) {
        const iframe = document.getElementById('pdf');
        iframe.src = src;
        iframe.style.background = '#000';
      }
    })();
  </script>
</body>
</html>
