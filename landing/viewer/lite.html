<!doctype html><html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viewer PDF Lite</title>
<style>
  :root { --bg:#000; --fg:#fff; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg); }
  #pages{ position:fixed; inset:0; overflow:auto; -webkit-overflow-scrolling:touch; padding:12px 0; }
  .page{ display:flex; justify-content:center; margin:0 0 8px; }
  canvas{ width:100vw; max-width:none; height:auto; background:#111; box-shadow:0 2px 24px rgba(0,0,0,.35)}
</style>
</head>
<body>
<!-- DMS Auth Gate -->
<!-- AUTENTICAZIONE RIMOSSA: script auth-gate eliminato -->

<div id="pages" aria-live="polite"></div>

<script type="module">
  // ⚠️ CDN temporaneo (poi possiamo "vendorizzare" in repo)
  import * as pdfjsLib from "https://unpkg.com/pdfjs-dist@4.6.82/build/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs";

  const qs = new URLSearchParams(location.search);
  const fileUrl = qs.get('src');
  if (!fileUrl) {
    document.body.innerHTML = '<div style="display:flex;min-height:100dvh;align-items:center;justify-content:center;font:600 18px system-ui;padding:24px;text-align:center">Documento non trovato.</div>';
  } else {
    const container = document.getElementById('pages');
    
    // Calcolo zoom automatico per riempire sempre tutta la larghezza
    const getAutoScale = () => {
      const vw = window.innerWidth;
      // Scala basata sulla larghezza per riempire sempre tutto lo schermo
      return vw / 595; // 595 è la larghezza standard di una pagina PDF in punti
    };

    const renderDoc = async () => {
      container.innerHTML = '';
      const scale = getAutoScale();
      const pdf = await pdfjsLib.getDocument({ url: fileUrl, withCredentials:false }).promise;
      for (let p=1; p<=pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { alpha:false });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const wrap = document.createElement('div'); wrap.className='page';
        wrap.appendChild(canvas); container.appendChild(wrap);
        await page.render({ canvasContext: ctx, viewport }).promise;
      }
    };

    // Re-render su resize per zoom automatico
    window.addEventListener('resize', renderDoc);
    
    renderDoc();
  }

  // Hardenings minimi (evita "stampa/condividi")
  const kill=e=>{e.preventDefault();e.stopPropagation();return false;};
  document.addEventListener('contextmenu',kill,{capture:true});
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase(),ctrl=e.ctrlKey||e.metaKey;
    if ((ctrl && (k==='p'||k==='s'||k==='o'||k==='u')) || k==='f12' || (e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))) return kill(e);
  },{capture:true});
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible'){ document.body.style.opacity='0'; } else { document.body.style.opacity=''; }});
</script>
</body>
</html>
