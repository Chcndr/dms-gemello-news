<!doctype html><html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viewer PDF Lite</title>
<style>
  :root { --bg:#000; --fg:#fff; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg); }
  #toolbar { position:fixed; top:8px; right:8px; z-index:10; display:flex; gap:6px; }
  #toolbar button{ border:0; border-radius:8px; padding:8px 10px; font:600 14px system-ui;
                   background:rgba(255,255,255,.12); color:#fff; }
  #pages{ position:fixed; inset:0; overflow:auto; -webkit-overflow-scrolling:touch; padding:56px 0 24px; }
  .page{ display:flex; justify-content:center; margin:0 0 12px; }
  canvas{ width:min(100vw, 1100px); height:auto; background:#111; box-shadow:0 2px 24px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="toolbar">
  <button id="zoomOut">−</button>
  <button id="zoomIn">＋</button>
</div>
<div id="pages" aria-live="polite"></div>

<script type="module">
  // ⚠️ CDN temporaneo (poi possiamo "vendorizzare" in repo)
  import * as pdfjsLib from "https://unpkg.com/pdfjs-dist@4.6.82/build/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs";

  const qs = new URLSearchParams(location.search);
  const fileUrl = qs.get('src');
  if (!fileUrl) {
    document.body.innerHTML = '<div style="display:flex;min-height:100dvh;align-items:center;justify-content:center;font:600 18px system-ui;padding:24px;text-align:center">Documento non trovato.</div>';
  } else {
    const container = document.getElementById('pages');
    let scale = 1.2; // riempie bene in verticale su iPad

    const renderDoc = async () => {
      container.innerHTML = '';
      const pdf = await pdfjsLib.getDocument({ url: fileUrl, withCredentials:false }).promise;
      for (let p=1; p<=pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { alpha:false });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const wrap = document.createElement('div'); wrap.className='page';
        wrap.appendChild(canvas); container.appendChild(wrap);
        await page.render({ canvasContext: ctx, viewport }).promise;
      }
    };

    document.getElementById('zoomIn').onclick  = ()=>{ scale = Math.min(scale+0.1, 3); renderDoc(); };
    document.getElementById('zoomOut').onclick = ()=>{ scale = Math.max(scale-0.1, 0.6); renderDoc(); };

    renderDoc();
  }

  // Hardenings minimi (evita "stampa/condividi")
  const kill=e=>{e.preventDefault();e.stopPropagation();return false;};
  document.addEventListener('contextmenu',kill,{capture:true});
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase(),ctrl=e.ctrlKey||e.metaKey;
    if ((ctrl && (k==='p'||k==='s'||k==='o'||k==='u')) || k==='f12' || (e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))) return kill(e);
  },{capture:true});
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible'){ document.body.style.opacity='0'; } else { document.body.style.opacity=''; }});
</script>
</body>
</html>
