<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DMS • Viewer protetto</title>
<style>
  html,body{height:100%;margin:0;background:#0d2d2e}
  #pdf{position:fixed;inset:0;width:100%;height:100%;border:0}
  #blocker{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);color:#fff;font:600 18px system-ui}
  .blocked #blocker{display:flex}
  .blocked #pdf{filter:blur(6px);pointer-events:none}
  @media print { body{display:none !important} }
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>
</head><body>
  <!-- DMS Auth Gate -->
  <!-- AUTENTICAZIONE RIMOSSA: script auth-gate eliminato -->
  
  <iframe id="pdf" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe>
  <div id="blocker">Stampa/Esporta disabilitata su questo documento.</div>
<script>
  const qp=new URLSearchParams(location.search);
  const src=qp.get('src'); if(!src){ location.replace('/dms-gemello-news/'); }
  document.getElementById('pdf').src = src + '#toolbar=0&navpanes=0&scrollbar=0';
  function block(r='print'){ document.body.classList.add('blocked'); setTimeout(()=>location.replace('/dms-gemello-news/landing/viewer/blocked.html?why='+r),800); }
  ['keydown','keyup'].forEach(ev=>addEventListener(ev,e=>{const k=(e.key||'').toLowerCase(); if((e.ctrlKey||e.metaKey)&&(k==='p'||k==='s')){e.preventDefault();e.stopPropagation();block(k);} },true));
  addEventListener('contextmenu',e=>e.preventDefault(),true);
  addEventListener('dragstart',e=>e.preventDefault(),true);
  addEventListener('beforeprint',e=>{e.preventDefault?.();block('beforeprint');});
  const mq=matchMedia('print'); mq.addEventListener?.('change',m=>{ if(m.matches) block('media-print'); });
</script>
</body></html>
