<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Viewer</title>
  <style>
    html, body { height:100%; margin:0; background:#000; }
    body { overflow:hidden; -webkit-user-select:none; user-select:none; }
    #wrap { position:fixed; inset:0; background:#000; }
    #pdf  { display:block; width:100%; height:100%; border:0; background:#000; }
    #topbar{
      position:fixed; top:10px; right:10px; z-index:9;
      background:#0b0b0b; border:1px solid #2a2a2a; border-radius:10px;
      padding:8px 12px; line-height:1; opacity:.95; font:14px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    #topbar a{
      color:#fff; text-decoration:none;
    }
    #shield{ /* cattura tasto destro e gesture stampa su alcuni browser */
      position:fixed; inset:0; background:transparent; z-index:8;
    }
    @media (prefers-reduced-motion:no-preference){
      #topbar { transition:opacity .2s ease }
      #topbar:hover { opacity:1 }
    }
    /* Hard block stampa lato CSS */
    @media print { * { display:none !important; } }
  </style>
</head>
<body>
  <div id="wrap">
    <iframe id="pdf" allowfullscreen referrerpolicy="no-referrer"></iframe>
  </div>

  <div id="topbar">
    <a id="open-ext" target="_blank" rel="noopener">Apri in nuova scheda ↗</a>
  </div>

  <div id="shield"></div>

  <script>
  (function(){
    const params = new URLSearchParams(location.search);
    // src relativo al viewer, niente slash iniziale
    let src = (params.get('src') || '').trim();

    // Se manca src, non facciamo nulla
    if(!src){
      document.body.innerHTML =
        '<div style="color:#fff;font:16px/1.4 system-ui;padding:24px">Nessun file specificato.<br>Usa: <code>?src=pdf/NOME.pdf</code></div>';
      return;
    }

    // Rimuove eventuale hash esistente e ri-appende i parametri che nascondono toolbar
    const [base, hash] = src.split('#');
    // Nasconde barra strumenti del viewer nativo e imposta vista
    const hashParams = 'toolbar=0&navpanes=0&scrollbar=1&view=FitH';
    src = `${base}#${hashParams}`;

    // Imposta iframe e link esterno
    const iframe = document.getElementById('pdf');
    iframe.src = src;
    // Link "apri" senza gli anchor
    document.getElementById('open-ext').href = base;

    // Blocco tentativi di stampa (Ctrl/Cmd+P) e menu contestuale
    const killPrint = (e) => {
      const k = (e.key || '').toLowerCase();
      if ((e.ctrlKey || e.metaKey) && (k === 'p' || e.keyCode === 80)) {
        e.preventDefault(); e.stopPropagation();
        alert('Stampa disabilitata.');
        return false;
      }
    };
    document.addEventListener('keydown', killPrint, true);
    document.addEventListener('contextmenu', e => e.preventDefault(), true);

    // Alcuni browser chiamano beforeprint: svuotiamo il DOM
    window.onbeforeprint = () => { document.body.innerHTML = ''; };

    // Evita drag&drop dal viewer
    document.addEventListener('dragstart', e => e.preventDefault(), true);

    // iOS/Safari: tenta di impedire azioni sistema su longa pressione
    document.getElementById('shield').addEventListener('touchstart', () => {}, {passive:true});
  })();
  </script>
</body>
</html>
