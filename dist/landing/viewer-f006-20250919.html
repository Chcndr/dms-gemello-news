<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Viewer</title>
  <!-- META anti cache (best-effort, su Pages non garantito) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    html, body { height:100%; margin:0; background:#000; }
    body { overflow:hidden; -webkit-user-select:none; user-select:none; }
    #wrap { position:fixed; inset:0; background:#000; }
    #pdf  { display:block; width:100%; height:100%; border:0; background:#000; }
    #topbar{
      position:fixed; top:10px; right:10px; z-index:9;
      background:#0b0b0b; border:1px solid #2a2a2a; border-radius:10px;
      padding:8px 12px; line-height:1; opacity:.95; font:14px/1 system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:#fff; text-decoration:none;
    }
    #topbar a{ color:#fff; text-decoration:none; }
    #shield{ position:fixed; inset:0; background:transparent; z-index:8; }
    /* Hard block stampa lato CSS (se il browser lo rispetta) */
    @media print { * { display:none !important; } }
  </style>
</head>
<body>
  <div id="wrap">
    <iframe id="pdf" allowfullscreen referrerpolicy="no-referrer"></iframe>
  </div>
  <div id="topbar"><a id="open-ext" target="_blank" rel="noopener">Apri in nuova scheda ↗</a></div>
  <div id="shield"></div>

  <script>
  (function(){
    // Cache-buster runtime per l'iframe (aggiunge uniq=timestamp alla query se manca)
    const uniq = Date.now().toString(36);

    const p = new URLSearchParams(location.search);
    let src = (p.get('src') || '').trim();

    if(!src){
      document.body.innerHTML =
        '<div style="color:#fff;font:16px/1.4 system-ui;padding:24px">Nessun file specificato.<br>Usa: <code>?src=landing/pdf/NOME.pdf</code></div>';
      return;
    }

    // Se non c'è query, aggiungi ?_cb=uniq; se c'è già, aggiungi &_
    const hasQuery = src.includes('?');
    src += (hasQuery ? '&' : '?') + '_cb=' + uniq;

    // Rimuove eventuale hash e impone nascondi toolbar viewer nativo
    const base = src.split('#')[0];
    const hashParams = 'toolbar=0&navpanes=0&scrollbar=1&view=FitH';
    const iframeSrc = base + '#' + hashParams;

    // Set iframe e link esterno (senza hash, mantiene cache-buster)
    const iframe = document.getElementById('pdf');
    iframe.src = iframeSrc;
    document.getElementById('open-ext').href = base;

    // Best-effort: blocco stampa e menu
    const killPrint = (e) => {
      const k = (e.key || '').toLowerCase();
      if ((e.ctrlKey || e.metaKey) && (k === 'p' || e.keyCode === 80)) {
        e.preventDefault(); e.stopPropagation();
        alert('Stampa disabilitata su questa pagina.');
        return false;
      }
    };
    document.addEventListener('keydown', killPrint, true);
    document.addEventListener('contextmenu', e => e.preventDefault(), true);
    window.onbeforeprint = () => { document.body.innerHTML = ''; };

    // Evita drag dal viewer
    document.addEventListener('dragstart', e => e.preventDefault(), true);

    // iOS/Safari: "tocca" lo shield per limitare tap prolungati
    document.getElementById('shield').addEventListener('touchstart', () => {}, {passive:true});
  })();
  </script>
</body>
</html>
