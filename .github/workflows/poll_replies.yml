name: Controlla Risposte Email DMS

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Forza controllo anche se recente"
        required: false
        default: "false"
  schedule:
    - cron: "*/5 * * * *"  # Ogni 5 minuti

jobs:
  check-replies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"
          
      - name: Install dependencies
        run: npm install imap simple-mail-parser
        
      - name: Check email replies
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: "Chcndr"
          REPO_NAME: "dms-access-tracker"
        run: |
          cat > check-replies.js << "EOL"
          const Imap = require("imap");
          const simpleParser = require("simple-mail-parser");
          const https = require("https");
          const fs = require("fs");
          const path = require("path");
          
          const imap = new Imap({
            user: process.env.IMAP_USER,
            password: process.env.IMAP_PASS,
            host: process.env.IMAP_HOST,
            port: 993,
            tls: true,
            tlsOptions: { rejectUnauthorized: false }
          });
          
          const githubToken = process.env.GITHUB_TOKEN;
          const repoOwner = process.env.REPO_OWNER;
          const repoName = process.env.REPO_NAME;
          
          const issueRegex = /info\+(\d+)(?:-[A-Za-z0-9]+)?@dms\.assocoates/i;
          
          function addGitHubComment(issueNumber, body) {
            return new Promise((resolve, reject) => {
              const data = JSON.stringify({ body: body });
              const options = {
                hostname: "api.github.com",
                path: `/repos/${repoOwner}/${repoName}/issues/${issueNumber}/comments`,
                method: "POST",
                headers: {
                  "User-Agent": "DMS-Email-Reply-System",
                  "Authorization": `token ${githubToken}`,
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json",
                  "Content-Length": data.length
                }
              };
              
              const req = https.request(options, (res) => {
                let responseData = "";
                res.on("data", (chunk) => { responseData += chunk; });
                res.on("end", () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(JSON.parse(responseData));
                  } else {
                    reject(new Error(`GitHub API error ${res.statusCode}: ${responseData}`));
                  }
                });
              });
              req.on("error", (error) => { reject(error); });
              req.write(data);
              req.end();
            });
          }
          
          function processEmails() {
            return new Promise((resolve, reject) => {
              imap.once("ready", () => {
                imap.openBox("INBOX", false, (err, box) => {
                  if (err) return reject(err);
                  const since = new Date();
                  since.setDate(since.getDate() - 7);
                  imap.search(["UNSEEN", ["SINCE", since]], (err, results) => {
                    if (err) return reject(err);
                    if (!results.length) {
                      console.log("Nessuna nuova risposta trovata");
                      return resolve([]);
                    }
                    const processed = [];
                    const f = imap.fetch(results, { bodies: "", markSeen: true });
                    f.on("message", (msg, seqno) => {
                      let emailData = "";
                      msg.on("body", (stream) => { stream.on("data", (chunk) => { emailData += chunk.toString("utf8"); }); });
                      msg.once("end", async () => {
                        try {
                          const email = await simpleParser(emailData);
                          const toAddresses = [email.to, email.cc].filter(Boolean).join(", ");
                          const match = toAddresses.match(issueRegex);
                          if (match) {
                            const issueNumber = match[1];
                            const comment = await addGitHubComment(issueNumber, "OK");
                            processed.push({ issue: issueNumber, from: email.from, comment: comment });
                          }
                        } catch (e) {
                          console.error("Errore elaborazione email:", e);
                        }
                      });
                    });
                    f.once("error", (err) => { reject(err); });
                    f.once("end", () => {
                      imap.end();
                      resolve(processed);
                    });
                  });
                });
              });
              imap.once("error", (err) => { reject(err); });
              imap.connect();
            });
          }
          
          async function main() {
            try {
              const processed = await processEmails();
              console.log(`Elaborate ${processed.length} risposte email`);
            } catch (e) {
              console.error("Errore:", e);
              process.exit(1);
            }
          }
          
          main();
          EOL
          
          node check-replies.js

      - name: Commit history file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add landing/admin/history/access.json || true
          git commit -m "Aggiornato storico risposte" || true
          git push

