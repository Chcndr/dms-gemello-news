name: Open 60' Window
on:
  workflow_dispatch:
    inputs:
      sub:
        description: "Email/subject dell'utente"
        required: true
        type: string
      jti:
        description: "Token ID (jti) - opzionale se non disponibile"
        required: false
        type: string
      scope:
        description: "Scope di accesso (default: news-private)"
        required: false
        default: "news-private"
        type: string
      minutes:
        description: "Durata in minuti (default: 60)"
        required: false
        default: "60"
        type: string

jobs:
  update_whitelist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update whitelist.json
        run: |
          python3 -c "
          import json
          import os
          from datetime import datetime, timezone, timedelta
          
          # Parametri input
          sub = '${{ github.event.inputs.sub }}'.lower().strip()
          jti = '${{ github.event.inputs.jti }}'.strip() if '${{ github.event.inputs.jti }}' else None
          scope = '${{ github.event.inputs.scope }}'.strip() or 'news-private'
          minutes = int('${{ github.event.inputs.minutes }}' or '60')
          
          # Calcola scadenza
          now = datetime.now(timezone.utc)
          exp = int((now + timedelta(minutes=minutes)).timestamp())
          
          # Path del file
          whitelist_path = 'landing/viewer/whitelist.json'
          
          # Carica whitelist esistente o crea nuova
          if os.path.exists(whitelist_path):
              with open(whitelist_path, 'r') as f:
                  data = json.load(f)
          else:
              data = {
                  'version': 1,
                  'generated_at': now.isoformat(),
                  'entries': []
              }
          
          # Assicura struttura corretta
          if 'entries' not in data:
              data['entries'] = []
          
          # Cerca entry esistente per sub o jti
          existing_index = -1
          for i, entry in enumerate(data['entries']):
              if (entry.get('sub', '').lower() == sub) or (jti and entry.get('jti') == jti):
                  existing_index = i
                  break
          
          # Crea nuova entry
          new_entry = {
              'sub': sub,
              'scope': [scope],
              'exp': exp
          }
          
          if jti:
              new_entry['jti'] = jti
          
          # Aggiorna o inserisci entry
          if existing_index >= 0:
              data['entries'][existing_index] = new_entry
              print(f'✅ Aggiornata entry esistente per {sub}')
          else:
              data['entries'].append(new_entry)
              print(f'✅ Creata nuova entry per {sub}')
          
          # Aggiorna metadata
          data['generated_at'] = now.isoformat()
          
          # Salva file
          os.makedirs(os.path.dirname(whitelist_path), exist_ok=True)
          with open(whitelist_path, 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f'📋 Whitelist aggiornata:')
          print(f'   - Email: {sub}')
          print(f'   - JTI: {jti or \"N/A\"}')
          print(f'   - Scope: {scope}')
          print(f'   - Scadenza: {datetime.fromtimestamp(exp, timezone.utc).isoformat()}')
          print(f'   - Durata: {minutes} minuti')
          "

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(auth): open 60' window for ${{ github.event.inputs.sub }} (${{ github.event.inputs.minutes }}m)"
          file_pattern: "landing/viewer/whitelist.json"
          commit_user_name: "DMS Auth Bot"
          commit_user_email: "auth-bot@dms-gemello-news.github.io"

      - name: Verify deployment
        run: |
          echo "🎉 Sessione attivata con successo!"
          echo "📧 Email: ${{ github.event.inputs.sub }}"
          echo "🔑 JTI: ${{ github.event.inputs.jti }}"
          echo "🎯 Scope: ${{ github.event.inputs.scope }}"
          echo "⏰ Durata: ${{ github.event.inputs.minutes }} minuti"
          echo ""
          echo "🔗 Verifica whitelist:"
          echo "https://chcndr.github.io/dms-gemello-news/landing/viewer/whitelist.json"
          echo ""
          echo "📝 L'utente può ora accedere con il suo link JWT per i prossimi ${{ github.event.inputs.minutes }} minuti."
