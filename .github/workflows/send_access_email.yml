name: Invia Email di Accesso DMS

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Indirizzo email destinatario"
        required: true
      issue:
        description: "Numero Issue GitHub"
        required: true
      token_link:
        description: "Link token DMS"
        required: true
      subject:
        description: "Oggetto email (opzionale)"
        required: false
        default: "Accesso DMS - Gemello Digitale del Commercio"

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Install dependencies
        run: npm install nodemailer
        
      - name: Send email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ github.event.inputs.to }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue }}
          TOKEN_LINK: ${{ github.event.inputs.token_link }}
          EMAIL_SUBJECT: ${{ github.event.inputs.subject }}
        run: |
          cat > send-email.js << 'EOL'
          const nodemailer = require('nodemailer');
          
          async function main() {
            const transporter = nodemailer.createTransport({
              host: process.env.SMTP_HOST,
              port: parseInt(process.env.SMTP_PORT),
              secure: process.env.SMTP_PORT === '465',
              auth: {
                user: process.env.SMTP_USER,
                pass: process.env.SMTP_PASS
              }
            });
            
            const toEmail = process.env.TO_EMAIL;
            const issueNumber = process.env.ISSUE_NUMBER;
            const tokenLink = process.env.TOKEN_LINK;
            const subject = process.env.EMAIL_SUBJECT || 'Accesso DMS - Gemello Digitale del Commercio';
            
            const replyToAddress = `info+${issueNumber}@dms.assocoates`;
            
            const htmlBody = `
            <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
              <h2 style="color: #333;">Accesso DMS - Gemello Digitale del Commercio</h2>
              <p>Ciao,</p>
              <p>Hai ricevuto l'accesso al sistema DMS.</p>
              <p><strong>🔗 Link di accesso:</strong><br>
              <a href="${tokenLink}" style="color: #0066cc;">${tokenLink}</a></p>
              <div style="background-color: #f5f5f5; padding: 15px; border-left: 4px solid #0066cc; margin: 20px 0;">
                <p><strong>📋 Istruzioni:</strong></p>
                <ol>
                  <li>Clicca sul link sopra</li>
                  <li><strong>RISPONDI A QUESTA EMAIL</strong> (anche vuota, basta premere "Rispondi" e "Invia")</li>
                  <li>Il sistema rileverà automaticamente la tua risposta</li>
                  <li>L'accesso si sbloccherà per 60 minuti</li>
                </ol>
              </div>
              <p>Se il link scade, rispondi di nuovo a questa email per riattivarlo.</p>
              <p>Cordiali saluti,<br>
              Team DMS</p>
            </div>
            `;
            
            const textBody = `
            Accesso DMS - Gemello Digitale del Commercio
            
            Ciao,
            
            Hai ricevuto l'accesso al sistema DMS.
            
            🔗 Link di accesso:
            ${tokenLink}
            
            📋 Istruzioni:
            1. Clicca sul link sopra
            2. RISPONDI A QUESTA EMAIL (anche vuota, basta premere "Rispondi" e "Invia")
            3. Il sistema rileverà automaticamente la tua risposta
            4. L'accesso si sbloccherà per 60 minuti
            
            Se il link scade, rispondi di nuovo a questa email per riattivarlo.
            
            Cordiali saluti,
            Team DMS
            `;
            
            const info = await transporter.sendMail({
              from: `"DMS System" <${process.env.SMTP_USER}>`,
              to: toEmail,
              cc: replyToAddress,
              subject: subject,
              text: textBody,
              html: htmlBody,
              headers: {
                'X-DMS-Issue': issueNumber,
                'X-DMS-Token': tokenLink.split('=').pop().substring(0, 20) + '...'
              }
            });
            
            console.log(`Email inviata: ${info.messageId}`);
          }
          
          main().catch(console.error);
          EOL
          
          node send-email.js

      - name: Commit history file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add landing/admin/history/access.json || true
          git commit -m "Aggiornato storico accessi" || true
          git push

